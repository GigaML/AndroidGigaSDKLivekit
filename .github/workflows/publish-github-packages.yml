name: Publish GitHub Packages Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v"
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          if [[ -z "$version" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ -n "$version" ]]; then
            echo "ORG_GRADLE_PROJECT_VERSION_NAME=$version" >> "$GITHUB_ENV"
            echo "Publishing version $version"
          else
            echo "Using VERSION_NAME from gradle.properties"
          fi

      - name: Run SDK checks
        run: ./gradlew :gigasdk-livekit:testDebugUnitTest :gigasdk-livekit:assemble

      - name: Publish to GitHub Packages
        run: ./gradlew :gigasdk-livekit:publishReleasePublicationToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ secrets.GITHUB_PACKAGES_ACTOR != '' && secrets.GITHUB_PACKAGES_ACTOR || github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN != '' && secrets.GITHUB_PACKAGES_TOKEN || github.token }}
